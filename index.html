<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172f38"><title>创院重点工作排期工作台</title><link rel="stylesheet" href="style.css?v=1.15"></head>
<body><aside class="rail"><div class="logo">月<span>序</span></div><div class="rail-line"></div><span class="vertical">把重要的事，放进月份里</span><span class="rail-foot">工作排期 · V1.0</span></aside>
<main><header><div><div class="eyebrow">WORK PLANNER / 创新创业工作</div><h1>创院重点工作排期工作台<span class="dot">.</span></h1></div><div class="header-actions"><span id="saveState" role="status">本机保存</span><button id="backupBtn">备份</button><button class="primary" id="addBtn">＋ 新增事项</button></div></header>

<nav class="view-nav" aria-label="工作视图"><button id="calendarView" class="active">全年月历</button><button id="workView">单项工作排期</button><span>创院统筹 · 创新创业业务</span></nav>
<section id="workPanel" hidden><div class="work-intro"><h2>一项工作，一条完整排期</h2></div><div id="workCards" class="work-cards"></div><section id="workTimeline"></section></section>
<section class="toolbar"><div class="year-nav"><button id="prevYear" aria-label="上一年">‹</button><strong id="yearLabel"></strong><button id="nextYear" aria-label="下一年">›</button><button id="nowBtn">回到本月</button></div><div class="filters"><label class="sr" for="category">工作类别</label><select id="category"><option value="">全部工作线</option><option value="创新大赛">互联网+</option><option>挑战杯</option><option value="职规赛">职规</option><option>大创与日常</option><option>活动承办</option><option>统筹与复盘</option><option value="成果管理">成果统计、认定与奖励</option></select><label class="sr" for="search">搜索事项</label><input id="search" placeholder="搜索事项、负责人、成果…"><button id="trashBtn">回收站</button></div></section>
<div class="workspace"><section><div class="section-label"><h2>全年月历</h2></div><div id="calendar" class="calendar"></div><section id="noticePanel" class="notice-panel" hidden><div class="section-label"><h2>按通知办理</h2></div><div id="noticeTasks"></div></section></section><aside class="detail"><div class="detail-head"><div class="small-label" id="detailYear"></div><div class="month-title"><h2 id="monthTitle"></h2><span id="monthCount"></span></div><p id="monthTheme"></p></div><div class="detail-tools"><span id="progressText"></span><button id="monthExport">导出本月</button></div><div class="progress"><i id="progressBar"></i></div><div id="tasks"></div><button class="add-month" id="addMonth">＋ 给这个月添加事项</button></aside></div>
<footer><p>排期版本 2026.11.03 · 创院年度业务安排</p><div><button id="csvBtn">导出全年 CSV</button><button id="importBtn">导入备份</button><button id="printBtn">打印全年</button></div></footer></main>
<dialog id="editor"><form id="taskForm"><div class="dialog-head"><h2 id="editorTitle">新增事项</h2><button type="button" class="close" data-close="editor" aria-label="关闭">×</button></div><label>事项名称<input name="title" required maxlength="120"></label><div class="form-row"><label>年份<input name="year" type="number" min="2020" max="2100" required></label><label>月份<select name="month"></select></label><label>工作线<select name="category"><option value="创新大赛">互联网+</option><option>挑战杯</option><option value="职规赛">职规</option><option>大创与日常</option><option>活动承办</option><option>统筹与复盘</option><option value="成果管理">成果统计、认定与奖励</option></select></label></div><label>所属阶段<input name="stage" maxlength="100"></label><div class="form-row form-row-two"><label>状态<select name="status"><option>未开始</option><option>推进中</option><option>待协调</option><option>已完成</option></select></label><label>负责人<input name="owner" maxlength="180"></label></div><label>具体工作<textarea name="action" rows="3" maxlength="3000"></textarea></label><label>应形成成果<textarea name="output" rows="2" maxlength="2000"></textarea></label><label class="check"><input type="checkbox" name="keyMilestone"> 本月正赛关键节点</label><div class="dialog-actions"><button type="button" id="deleteBtn">移入回收站</button><button type="submit" class="primary">保存事项</button></div></form></dialog>

<dialog id="trashDialog"><div class="dialog-head"><h2>回收站</h2><button class="close" data-close="trashDialog" aria-label="关闭">×</button></div><p class="muted">删除的事项保留在这里，可恢复原月份。</p><div id="trashList"></div></dialog><input id="fileInput" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><script src="data.js?v=1.15"></script><script src="workflows.js?v=1.15"></script><script src="app.js?v=1.15"></script></body></html>
